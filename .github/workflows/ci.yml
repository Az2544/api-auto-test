name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start service via Docker Compose
        run: docker compose up --build -d

      - name: Wait for service ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "service is up"
              exit 0
            fi
            echo "waiting... ($i/30)"
            sleep 2
          done
          echo "service failed to start"
          docker compose logs
          exit 1

      - name: Run tests
        run: pytest

      - name: Download Allure CLI
        if: always()
        run: |
          curl -sSL --ssl-no-revoke -o allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -xzf allure.tgz

      - name: Generate Allure Report
        if: always()
        run: ./allure-2.30.0/bin/allure generate allure-results -o allure-report --clean

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Stop service
        if: always()
        run: docker compose down